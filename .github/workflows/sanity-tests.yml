name: Run Sanity Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'Override: specific bundle version to test against (leave blank to use current branch state)'
        required: false
        default: ''

jobs:
  sanity:
    name: Sanity Tests (MariaDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-sanity-${{ hashFiles('sanity-tests/pom.xml', 'pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-sanity

      # Install the bundle jar into local Maven repo so sanity-tests can resolve it
      - name: Build and install the bundle (db-sharding-bundle)
        run: mvn -B -DskipTests clean install -q

      # Ask the bundle's own pom.xml what version it currently is — the single source of truth
      - name: Read the bundle's actual version
        id: bundle_version
        run: |
          VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Run sanity tests (Docker is pre-installed on ubuntu-latest runners)
      - name: Run sanity tests (sanity-tests)
        working-directory: sanity-tests
        run: |
          OVERRIDE="${{ github.event.inputs.bundle_version }}"
          VERSION="${OVERRIDE:-${{ steps.bundle_version.outputs.version }}}"
          echo "Testing against bundle version: $VERSION"
          mvn -B test -Dsharding.bundle.version=${VERSION}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-reports
          path: sanity-tests/target/surefire-reports/